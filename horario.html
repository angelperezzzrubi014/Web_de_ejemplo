<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Horario</title>
    <link rel="stylesheet" href="./CSS/horario.css">
</head>

<body>
    <header>
        <div>
        <h1>Horario semanal</h1>
        </div>
    </header>
    <main>
        <table border="1">
            <tr>
                <th>Hora</th>
                <th>Lunes</th>
                <th>Martes</th>
                <th>Miércoles</th>
                <th>Jueves</th>
                <th>Viernes</th>
            </tr>
          
            <tr>
                <td>8:30 - 9:25</td>
                <td rowspan="2" class="IPE">IPE</td>
                <td class="SASP">SASP</td>
                <td rowspan="2" class="LLMM">LLMM</td>
                <td class="IPCGS">IPCGS</td>
                <td rowspan="2" class="PAR">PAR</td>
                
               
            </tr>
            <tr>
                <td>9:25 - 10:20</td>
                <td class="IPE">IPE</td>
                <td rowspan="2" class="ISO">ISO</td>
                
                
               
              
             
            </tr>

            <tr>
                <td>10:20 - 11:15</td>
                <td class="PAR">PAR</td>
                <td rowspan="2" class="BD">BD</td>
                <td rowspan="2" class="PAR">PAR</td>
                <td rowspan="2" class="FFHH">FFHH</td>
               
            </tr>
            
            <tr>
                <td>11:45 - 12:40</td>
                <td class="IPCGS">IPCGS</td>
                <td rowspan="2" class="BD">BD</td>
            
                
                
                
                
            </tr>
            <tr>
                <td>12:40 - 13:35</td>
                <td rowspan="2" class="ISO">ISO</td>
                <td class="PIMAS">PIMAS</td>
                <td rowspan="2" class="DASP">DASP</td>
                <td rowspan="2" class="ISO">ISO</td>
                
            </tr>
            <tr>
                <td>13:35 - 14:30</td>
                <td class="FFHH">FFHH</td>
                <td class="LLMM">LLMM</td>
                    
                
        </table>
    </main>

</body>
</html>
